<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Employee data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <h1>Employee data</h1>
   <div class="container mt-5">
    <h2 class="text-center mb-4">Add Employee</h2>

    <form action="/add" method="POST" class="card p-4 shadow">
        <input class="form-control mb-2" type="text" name="name" placeholder="Name" required>

        <input class="form-control mb-2" type="number" name="age" placeholder="Age" required>

        <input class="form-control mb-3" type="text" name="department" placeholder="Department" required>

        <button class="btn btn-primary">Add Employee</button>
    </form>
   </div>
    <a href="/list">View list</a>
  </body>
</html>
